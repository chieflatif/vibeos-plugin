name: VibeOS quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vibeos-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vibeos-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install locked test dependencies
        run: python -m pip install --requirement requirements-ci.lock
      - name: Run canonical pre-commit quality gate
        run: >-
          bash plugins/vibeos/scripts/gate-runner.sh pre_commit
          --continue-on-failure
          --manifest plugins/vibeos/quality-gate-manifest.json
          --project-dir .
          --framework-dir plugins/vibeos
      - name: Validate work-order contracts and index
        run: |
          python plugins/vibeos/scripts/wo-frontmatter-lint.py lint --project-dir .
          python plugins/vibeos/scripts/wo-frontmatter-lint.py validate-index --project-dir .
